name: Build Android remote support APKs
on:
  push:
    branches: [android-remote-support]
    paths:
      - 'android-remote-support/**'
      - '.github/workflows/build-android-remote-support.yml'
  workflow_dispatch:
jobs:
  build-apks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-remote-support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - run: gradle --no-daemon assembleClientDebug assembleControllerDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Lafrich-Remote-Android-APKs
          path: android-remote-support/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  check-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-remote-support/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run check
