name: Build Membangun Mini Laptop APK
on:
  push:
    branches: [main]
    paths:
      - 'android-mini-laptop/**'
      - 'membangun/laptop.html'
      - '.github/workflows/build-mini-laptop-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER" || { echo "SDK Manager unavailable in $SDK_HOME"; find "$SDK_HOME" -maxdepth 3 -type f -name sdkmanager; exit 1; }
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: gradle -p android-mini-laptop --no-daemon assembleDebug
      - name: Rename Android package
        run: cp android-mini-laptop/app/build/outputs/apk/debug/app-debug.apk membangun-mini-laptop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Membangun-Mini-Laptop-Android-APK
          path: membangun-mini-laptop.apk
      - name: Publish APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mini-laptop-${GITHUB_RUN_NUMBER}" membangun-mini-laptop.apk --title "Membangun Mini Laptop ${GITHUB_RUN_NUMBER}" --notes "Android Galaxy Fold, 90-degree landscape and five-app switcher. Debug APK for testing." --latest --target main
