name: Cloud-first Universal Contract Tests
on:
  push:
    branches: [feature/cloud-first-universal-v1]
    paths:
      - 'shared/cloud-first-universal.js'
      - 'shared/cloud-first-startup.js'
      - 'shared/cloud-first-drive.js'
      - 'shared/cloud-first-trial.html'
      - 'tests/cloud-first-universal.test.cjs'
      - 'tests/cloud-first-drive-mock.test.cjs'
      - 'tests/cloud-first-trial.test.cjs'
      - '.github/workflows/cloud-first-universal-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud core safety and universal interchange
        run: node --test tests/cloud-first-universal.test.cjs
      - name: Simulated Google Drive API and sync conflicts
        if: success() || failure()
        run: node --test tests/cloud-first-drive-mock.test.cjs
      - name: Trial UI isolation and smoke
        if: success() || failure()
        run: node --test tests/cloud-first-trial.test.cjs
      - name: Existing application regression suite
        if: success() || failure()
        run: node --test tests/membangun-launcher.test.cjs tests/semesta-asset-library.test.cjs tests/mahluk-unified-bridge.test.cjs tests/jiwa-foundation-contract.test.cjs tests/emotion-drive-oauth.test.cjs
