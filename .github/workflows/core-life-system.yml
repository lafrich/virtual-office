name: Core Life System tests

on:
  push:
    branches:
      - feat/core-life-system-phase-01
    paths:
      - "src/core-life-system/**"
      - ".github/workflows/core-life-system.yml"
  pull_request:
    paths:
      - "src/core-life-system/**"
      - ".github/workflows/core-life-system.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Core Life System unit tests
        run: node --test src/core-life-system/life-system.test.mjs
