name: Emotion Studio — Timeline Reorder
on:
  push:
    branches: [main]
    paths:
      - 'emotion-studio/frame-order.js'
      - 'emotion-studio/index.html'
      - 'tests/emotion-timeline-order.test.cjs'
      - '.github/workflows/emotion-timeline-order.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and reorder preserving 4-view atlas
        run: |
          node --check emotion-studio/frame-order.js
          node --test tests/emotion-timeline-order.test.cjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          path: virtual-office
      - uses: actions/checkout@v4
        with:
          repository: lafrich/virtual-life-asset-pipeline
          path: virtual-life-asset-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright@1.56.1
      - name: Serve application and linked pipeline from same origin
        run: python3 -m http.server 8091 --bind 127.0.0.1 >/tmp/emotion-timeline.log 2>&1 &
      - name: Test duplicate, drag, move, save and reload in Chrome
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,channel:'chrome',args:['--no-sandbox']});
           try{
            const page=await browser.newPage({viewport:{width:1440,height:900},acceptDownloads:true});
            await page.goto('http://127.0.0.1:8091/virtual-office/emotion-studio/',{
             waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>!!window.EmotionFrameOrder&&document.querySelectorAll('#timeline .frame-cell').length>0,
             null,{timeout:60000});
            await page.locator('#new').click();
            await page.waitForFunction(()=>document.querySelectorAll('#timeline .frame-cell').length===1);
            await page.locator('#duplicateFrame').click();
            await page.locator('#duplicateFrame').click();
            if(await page.locator('#timeline .frame-cell').count()!==3)throw Error('Duplicate did not add frames');
            await page.locator('#timeline .frame-cell').first().click();
            await page.locator('#duplicateFrame').click();
            const active=()=>page.locator('#timeline .frame-cell.active').evaluate(el=>Number(el.dataset.frameIndex));
            if(await active()!==1)throw Error('Duplicate did not insert adjacent to selected frame');
            const src=page.locator('#timeline .frame-cell').nth(1);
            const dst=page.locator('#timeline .frame-cell').nth(3);
            const rect=await dst.boundingBox();
            if(!rect)throw Error('Target frame not visible');
            await src.dragTo(dst,{targetPosition:{x:rect.width-5,y:rect.height/2}});
            if(await active()!==3)throw Error('HTML5 drag did not reorder to end');
            await page.locator('#frameMoveLeft').click();
            if(await active()!==2)throw Error('Move Left did not reorder');
            await page.locator('#save').click();
            await page.waitForFunction(()=>document.querySelector('#dirty')?.textContent?.includes('SAVED'),null,{timeout:20000});
            await page.locator('#reload').click();
            await page.waitForFunction(()=>document.querySelectorAll('#timeline .frame-cell').length===4,
             null,{timeout:20000});
            const [download]=await Promise.all([
             page.waitForEvent('download',{timeout:12000}),
             page.locator('#export').click()
            ]);
            const fs=require('node:fs'),png=fs.readFileSync(await download.path());
            if(png.readUInt32BE(16)!==256||png.readUInt32BE(20)!==448)
             throw Error('Saved PNG dimensions changed from 4x64 by 4x112');
            console.log(JSON.stringify({result:'PASS',frameCount:4,adjacentDuplication:true,
             nativeDrag:true,moveLeft:true,roundTrip:'indexedDB',pngSize:[256,448]}));
           }finally{await browser.close();}
          })().catch(error=>{console.error(error.stack||error);process.exit(1)});
          JS
