name: Game Asset Bridge — Validate

on:
  push:
    branches:
      - main
      - feature/game-asset-pipeline-bridge-v1
    paths:
      - "sw.js"
      - "tests/asset-bridge.test.cjs"
      - ".github/workflows/game-asset-bridge.yml"
  pull_request:
    paths:
      - "sw.js"
      - "tests/asset-bridge.test.cjs"
      - ".github/workflows/game-asset-bridge.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout virtual-office
        uses: actions/checkout@v4
      - name: Validate production scripts
        run: |
          node --check sw.js
      - name: Confirm unused old-game inspector is gone
        run: node tests/asset-bridge.test.cjs
