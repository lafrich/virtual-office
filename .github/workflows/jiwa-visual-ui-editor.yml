name: Jiwa UI Editor — Live Semesta Browser
on:
  push:
    branches: [main]
    paths:
      - "jiwa/jiwa.js"
      - "jiwa/index.html"
      - "jiwa/ui-layout-editor.js"
      - "shared/hud-layout.js"
      - "shared/play-hud.js"
      - "world-builder/builder.js"
      - "world-builder/semesta-life-play.js"
      - "tests/jiwa-visual-ui-editor.test.cjs"
      - "tests/jiwa-visual-ui-editor.e2e.cjs"
      - ".github/workflows/jiwa-visual-ui-editor.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-phone-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Semesta + Jiwa
        uses: actions/checkout@v4
        with:
          path: virtual-office
      - name: Checkout native asset pipeline
        uses: actions/checkout@v4
        with:
          repository: lafrich/virtual-life-asset-pipeline
          path: virtual-life-asset-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test canonical HUD layout rules
        run: |
          cd virtual-office
          node --check jiwa/ui-layout-editor.js
          node --check shared/hud-layout.js
          node --test tests/hud-layout.test.cjs tests/jiwa-visual-ui-editor.test.cjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Start local preview server
        run: |
          python3 -m http.server 8091 --bind 127.0.0.1 >/tmp/ui-editor-browser.log 2>&1 &
          sleep 2
      - name: "Browser test: drag resize save and Semesta HUD"
        run: node virtual-office/tests/jiwa-visual-ui-editor.e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jiwa-ui-layout-preview
          path: screenshots/
          if-no-files-found: ignore
