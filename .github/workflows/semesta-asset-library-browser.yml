name: Semesta Asset Library — Browser Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "world-builder/asset-library.js"
      - "world-builder/indonesia-assets.js"
      - "world-builder/asset-library.css"
      - "world-builder/semesta-traffic-art.js"
      - "world-builder/asset-thumbnails.js"
      - "world-builder/builder.js"
      - "world-builder/bangun-ruang/asset-library-intake.js"
      - "world-builder/bangun-ruang/index.html"
      - ".github/workflows/semesta-asset-library-browser.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          path: virtual-office
      - uses: actions/checkout@v4
        with:
          repository: lafrich/virtual-life-asset-pipeline
          path: virtual-life-asset-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install headless Chrome controller
        run: npm install --no-save playwright@1.56.1
      - name: Serve checked-out applications together, same origin
        run: |
          python3 -m http.server 8091 --bind 127.0.0.1 >/tmp/asset-library-server.log 2>&1 &
      - name: Open gallery, edit copy, save and check Semesta reload
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,channel:'chrome',
              args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--ignore-gpu-blocklist']});
            const context=await browser.newContext({viewport:{width:1400,height:900}});
            const page=await context.newPage();
            const faults=[];page.on('pageerror',err=>faults.push(err.message));
            await page.goto('http://127.0.0.1:8091/virtual-office/world-builder/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForFunction(()=>typeof document.getElementById('openAssetLibrary')?.onclick==='function',null,{timeout:90000});
            const skip=page.getByRole('button',{name:'Skip'});
            if(await skip.count())await skip.first().click().catch(()=>{});
            await page.locator('#openAssetLibrary').click();
            await page.locator('#semestaAssetLibrary[open]').waitFor();
            await page.waitForFunction(()=>document.querySelector('#salCount')?.textContent?.includes('VALID'),null,{timeout:120000});
            const cards=await page.locator('#salGallery .sal-card').count();
            const audit=await page.locator('#salCount').textContent();
            const emptyThumbnails=await page.locator('#salGallery .sal-card .sal-thumb span').count();
            if(emptyThumbnails)throw Error('Gallery contains thumbnail placeholders: '+emptyThumbnails);
            if(cards<300)throw Error('Published Indonesia 200 pack not loaded in gallery: '+cards);
            // Thumbnail/placement parity for all vehicle classes, including
            // bus_transjakarta and the published rider pipeline.
            // The 200 native Indonesian sprites are generated, not metadata.
            await page.locator('#salCategory').selectOption('indo200');
            await page.waitForFunction(()=>document.querySelector('#salCount')?.textContent?.includes('VALID'),null,{timeout:120000});
            const indonesia200=await page.locator('#salGallery .sal-card').count();
            if(indonesia200!==200)throw Error('Indonesia 200 gallery contains '+indonesia200+' rather than 200 verified assets');
            await page.locator('#salGallery [data-file="pipeline:id200_transport_angkot_kota"]').click();
            await page.waitForFunction(()=>document.querySelector('#salHero img')?.naturalWidth>20,null,{timeout:15000});
            await page.screenshot({path:'screenshots/semesta-indonesia-200-gallery.png',fullPage:false});

            await page.locator('#salCategory').selectOption('vehicle');
            await page.waitForFunction(()=>document.querySelector('#salCount')?.textContent?.includes('VALID'),null,{timeout:120000});
            await page.locator('#salGallery [data-file="vehicle:bus_transjakarta"]').click();
            await page.locator('#salHero img').waitFor({timeout:15000});
            await page.waitForFunction(()=>document.querySelector('#salHero img')?.naturalWidth>0,null,{timeout:15000});
            const vehicleCheck=await page.evaluate(async()=>{
              const img=document.querySelector('#salHero img');
              const s=await window.VLSemestaArt.vehiclePreviewAsync('bus_transjakarta','se');
              return {matching:img.src===s,width:img.naturalWidth,height:img.naturalHeight,
                buttons:document.querySelectorAll('#salViews button').length,
                source:img.dataset.source};
            });
            if(!vehicleCheck.matching||vehicleCheck.buttons!==4||vehicleCheck.width!==272||vehicleCheck.height!==256)
              throw Error('TransJakarta is not the original 272x256 pipeline sprite '+JSON.stringify(vehicleCheck));
            await page.screenshot({path:'screenshots/semesta-native-transjakarta-gallery.png',fullPage:false});
            const allVehicles=await page.evaluate(async()=>{
              const list=window.VLSemestaCatalog.vehicles;
              const result=await Promise.all(list.map(v=>window.VLSemestaArt.vehiclePreviewAsync(v.id,'se')));
              return {total:result.length,missing:result.filter(x=>!x).length};
            });
            if(allVehicles.missing)throw Error('Other vehicles have broken artwork: '+JSON.stringify(allVehicles));

            const carAudit=await page.evaluate(async()=>{
              const expected={sedan_red:[146,138],sedan_teal:[146,138],
                hatchback_orange:[136,132],mpv_silver:[152,144],
                taxi_bluebird:[152,148],van_cream:[162,162],
                bus_transjakarta:[272,256]};
              const dirs=['sw','se','ne','nw'],issues=[];
              for(const [id,size] of Object.entries(expected)){
                for(const dir of dirs){
                  const url=await window.VLSemestaArt.vehiclePreviewAsync(id,dir);
                  if(!url||!url.includes('/cars/'+id+'_'+dir+'.png')||url.startsWith('data:')){
                    issues.push({id,dir,reason:'proxy-or-not-found',url});continue;
                  }
                  const dims=await new Promise(resolve=>{
                    const img=new Image();
                    img.onload=()=>resolve([img.naturalWidth,img.naturalHeight]);
                    img.onerror=()=>resolve([0,0]);img.src=url;
                  });
                  if(dims[0]!==size[0]||dims[1]!==size[1])
                    issues.push({id,dir,reason:'geometry',dims,size});
                }
              }
              return {nativeViews:Object.keys(expected).length*dirs.length,issues};
            });
            if(carAudit.issues.length)throw Error('Other cars use wrong thumbnail art '+JSON.stringify(carAudit.issues));


            // Check the exact native v3 artwork for EVERY rider and EVERY
            // direction. The previous failure had a detailed Gojek but
            // crude proxy Gojek+passenger/Maxim due source not being requested.
            const riderAudit=await page.evaluate(async()=>{
              const expected={gojek:[60,87],gojek_pax:[54,92],maxim:[54,87],
                maxim_pax:[54,92],sma_triple:[66,96]};
              const dirs=['se','sw','ne','nw'],results=[];
              for(const [id,size] of Object.entries(expected)){
                for(const dir of dirs){
                  const url=await window.VLSemestaArt.vehiclePreviewAsync(id,dir);
                  if(!url||!url.includes('riders_v3/frames/'+id+'_'+dir+'_f0.png')||
                     url.startsWith('data:'))throw Error('Proxy thumbnail: '+id+'/'+dir+' '+url);
                  const image=await new Promise((resolve,reject)=>{
                    const img=new Image();
                    img.onload=()=>resolve([img.naturalWidth,img.naturalHeight]);
                    img.onerror=()=>reject(Error('Native PNG missing '+url));
                    img.src=url;
                  });
                  if(image[0]!==size[0]||image[1]!==size[1])
                    throw Error('Incorrect sprite geometry '+id+' '+dir+' '+image);
                  results.push({id,dir,size:image});
                }
              }
              return {nativeViews:results.length,ids:Object.keys(expected),failed:0};
            });
            await page.locator('#salGallery [data-file="vehicle:gojek_pax"]').click();
            await page.waitForFunction(()=>
              document.querySelector('#salHero img')?.naturalWidth===54&&
              document.querySelector('#salHero img')?.naturalHeight===92,
              null,{timeout:30000});
            await page.screenshot({path:'screenshots/semesta-native-ojol-gallery.png',fullPage:false});

            await page.locator('#salCategory').selectOption('character');
            await page.waitForFunction(()=>document.querySelector('#salCount')?.textContent?.includes('VALID'),null,{timeout:120000});
            const characterCard=page.locator('#salGallery [data-file^="character:"]').first();
            if(await characterCard.count()){
              await characterCard.click();
              await page.locator('#salHero img').waitFor({timeout:30000});
              await page.waitForFunction(()=>document.querySelector('#salHero img')?.naturalWidth>0,null,{timeout:30000});
              const size=await page.locator('#salHero img').evaluate(x=>[x.naturalWidth,x.naturalHeight]);
              if(size[0]!==64||size[1]!==112)throw Error('Character gallery shows full animation sheet '+size);
            }
            await page.locator('#salCategory').selectOption('all');
            await page.waitForFunction(()=>document.querySelector('#salCount')?.textContent?.includes('VALID'),null,{timeout:120000});

            await page.locator('#salGallery [data-file="pipeline:ruko_a"]').click();
            const views=await page.locator('#salViews button').count();
            if(views<2)throw Error('Native building views not shown');
            const detail=await page.locator('#salName').textContent();
            if(!(await page.locator('#salEdit').isEnabled()))throw Error('Edit copy not enabled for ruko');
            fs.mkdirSync('screenshots',{recursive:true});
            await page.screenshot({path:'screenshots/semesta-asset-gallery.png',fullPage:false});
            const [bangun]=await Promise.all([
              context.waitForEvent('page',{timeout:25000}),
              page.locator('#salEdit').click()
            ]);
            bangun.on('pageerror',err=>faults.push('bangun '+err.message));
            await bangun.waitForLoadState('domcontentloaded');
            await bangun.waitForFunction(()=>document.querySelector('#name')?.value?.includes('Custom'),null,{timeout:60000});
            const desc=await bangun.locator('#assetDescription').inputValue();
            if(!desc)throw Error('Source description missing in Bangun Ruang');
            await bangun.locator('#saveBtn').click();
            await bangun.waitForFunction(()=>document.querySelector('#status')?.textContent?.includes('Saved'),null,{timeout:30000});
            await bangun.screenshot({path:'screenshots/bangun-ruang-asset-edit-copy.png',fullPage:false});
            await page.bringToFront();
            await page.locator('#salCategory').selectOption('custom');
            await page.waitForFunction(()=>[...document.querySelectorAll('#salGallery .sal-card')].some(x=>x.textContent.includes('Custom')),null,{timeout:120000});
            const customs=await page.locator('#salGallery .sal-card').count();
            await page.screenshot({path:'screenshots/semesta-custom-asset-library.png',fullPage:false});
            console.log('ASSET_LIBRARY_SMOKE',JSON.stringify({cards,audit,emptyThumbnails,indonesia200,vehicleCheck,allVehicles,carAudit,riderAudit,views,detail,customs,description:desc.slice(0,90),faults:faults.slice(0,8)}));
            await browser.close();
            if(faults.some(x=>/SyntaxError|Cannot read properties|is not defined/i.test(x)))
              throw Error('Browser JS crash: '+faults.join('; '));
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-library-browser-preview
          path: screenshots/
          if-no-files-found: ignore
