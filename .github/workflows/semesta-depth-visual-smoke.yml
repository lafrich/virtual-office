name: Semesta native-depth browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/semesta-depth-visual-smoke.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: virtual-office
      - uses: actions/checkout@v4
        with:
          repository: lafrich/virtual-life-asset-pipeline
          path: virtual-life-asset-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve the exact checked-out Semesta and native asset pipeline
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/semesta-depth-server.log 2>&1 &
          sleep 2
      - name: Render real WebGL scene and report shader errors
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
           const browser=await chromium.launch({
            headless:true,
            args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--ignore-gpu-blocklist']
           });
           const page=await browser.newPage({viewport:{width:1280,height:800},deviceScaleFactor:1});
           const errors=[];
           page.on('console',msg=>{
             const line=msg.text();
             if(msg.type()==='error'&&/THREE|WebGL|shader|depth|module|Failed to load/i.test(line))errors.push(line);
           });
           page.on('pageerror',err=>errors.push('PAGE ERROR '+(err.stack||err.message)));
           page.on('response',response=>{
            if(response.status()>=400)console.log('RESOURCE_ERROR',response.status(),response.url());
           });
           await page.goto('http://127.0.0.1:8080/virtual-office/world-builder/',{waitUntil:'domcontentloaded',timeout:90000});
           await page.waitForTimeout(9000);
           const skip=page.getByRole('button',{name:'Skip'});
           if(await skip.count())await skip.first().click();
           await page.waitForTimeout(2000);
           const opts=await page.locator('#activeAssetPicker option').evaluateAll(xs=>xs.map(x=>({value:x.value,label:x.textContent})));
           console.log('PICKABLE_ASSETS',opts.slice(0,28).map(o=>o.label).join(' | '));
           const building=opts.find(x=>/house|rumah|ruko|office|hospital|school|hotel|bank|indomaret/i.test(x.label||''))||opts[1];
           if(building&&building.value){
            await page.selectOption('#activeAssetPicker',building.value);
            const focus=page.locator('#focusActiveAsset');
            if(await focus.isEnabled())await focus.click();
           }
           await page.waitForTimeout(3000);
           const state=await page.evaluate(()=>{
             const c=document.querySelector('canvas#world');
             return {canvas:!!c,width:c?.width,height:c?.height,
               webgl:!!(c?.getContext('webgl2')),
               title:document.title,
               message:document.querySelector('#empty')?.textContent?.slice(0,180)};
           });
           fs.mkdirSync('screenshots',{recursive:true});
           await page.screenshot({path:'screenshots/native-depth-city.png',fullPage:false});
           console.log('BROWSER_STATE',JSON.stringify(state));
           console.log('BROWSER_ERRORS',JSON.stringify(errors.slice(0,30)));
           const encoded=fs.readFileSync('screenshots/native-depth-city.png').toString('base64');
           console.log('BROWSER_CAPTURE_START');
           for(let i=0;i<encoded.length;i+=4000)console.log('CAP:'+encoded.slice(i,i+4000));
           console.log('BROWSER_CAPTURE_END');
           await browser.close();
           if(!state.canvas||state.width<300||state.height<300)throw Error('Canvas did not render');
           if(errors.some(s=>/THREE\.WebGLProgram|shader error|VALIDATE_STATUS|FRAGMENT shader|VERTEX shader/i.test(s)))
            throw Error('Runtime WebGL shader or page error detected: '+errors.join('; ').slice(0,1000));
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semesta-native-depth-screenshot
          path: screenshots/
          if-no-files-found: ignore
