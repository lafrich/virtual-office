name: Semesta Indonesia asset integration tests
on:
  push:
    branches: [main]
    paths:
      - "world-builder/indonesia-assets.js"
      - "world-builder/semesta-transport-npc.js"
      - "tests/semesta-transport-npc.test.cjs"
      - "world-builder/index.html"
      - "world-builder/builder.js"
      - "world-builder/asset-thumbnails.js"
      - "tests/semesta-indonesia-pack.test.cjs"
      - "tests/semesta-indonesia-200.test.cjs"
      - "tests/semesta-jakarta-urban.test.cjs"
      - "world-builder/jakarta-urban-assets.js"
      - "world-builder/map-terrain.js"
      - "world-builder/world-physics.js"
      - ".github/workflows/semesta-indonesia-pack.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check loader syntax
        run: |
          node --check world-builder/indonesia-assets.js
          node --check world-builder/jakarta-urban-assets.js
          node --check world-builder/map-terrain.js
          node --check world-builder/semesta-transport-npc.js
          node --check world-builder/asset-thumbnails.js
      - name: Run Semesta Indonesia / depth / thumbnail regression
        run: node --test tests/semesta-indonesia-pack.test.cjs tests/semesta-indonesia-200.test.cjs tests/semesta-transport-npc.test.cjs tests/semesta-asset-thumbnails.test.cjs tests/semesta-pipeline-grounding.test.cjs tests/semesta-jakarta-urban.test.cjs
