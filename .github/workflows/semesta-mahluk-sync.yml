name: Semesta + Mahluk Hidup — Sync Validation

on:
  push:
    branches:
      - main
    paths:
      - "world-builder/**"
      - "membangun/**"
      - "tests/membangun-launcher.test.cjs"
      - "tests/semesta-mahluk-sync.test.cjs"
      - "tests/semesta-base-human-gameplay.test.cjs"
      - "tests/semesta-custom-wardrobe-depth.test.cjs"
      - "tests/jiwa-base-human-gameplay.test.cjs"
      - "jiwa/**"
      - "tests/mahluk-action-frame-sync.test.cjs"
      - "tests/mahluk-universal-hygiene.test.cjs"
      - "tests/mahluk-template-runtime.test.cjs"
      - "tests/mahluk-appearance-runtime.test.cjs"
      - "tests/membangun-live-sync.test.cjs"
      - "tests/bangun-ruang-*.test.cjs"
      - "tests/semesta-traffic.test.cjs"
      - "tests/semesta-vehicle-queue.test.cjs"
      - "tests/semesta-vehicle-visuals.test.cjs"
      - "tests/semesta-vehicle-flip.test.cjs"
      - "tests/semesta-pan-tool.test.cjs"
      - "tests/semesta-clean-ui-menus.test.cjs"
      - "tests/semesta-tree-replacement.test.cjs"
      - "tests/semesta-placeholder-replacement.test.cjs"
      - "tests/semesta-kebon-sirih-style.test.cjs"
      - "tests/semesta-pipeline-grounding.test.cjs"
      - "tests/semesta-asset-thumbnails.test.cjs"
      - "tests/semesta-active-asset-camera.test.cjs"
      - "tests/semesta-simple-effects.test.cjs"
      - "tests/semesta-daynight.test.cjs"
      - "tests/semesta-sidewalk-and-lighting.test.cjs"
      - "tests/world-builder-v2.test.cjs"
      - ".github/workflows/semesta-mahluk-sync.yml"
  pull_request:
    paths:
      - "world-builder/**"
      - "membangun/**"
      - "tests/membangun-launcher.test.cjs"
      - "tests/semesta-mahluk-sync.test.cjs"
      - "tests/semesta-base-human-gameplay.test.cjs"
      - "tests/semesta-custom-wardrobe-depth.test.cjs"
      - "tests/jiwa-base-human-gameplay.test.cjs"
      - "jiwa/**"
      - "tests/mahluk-action-frame-sync.test.cjs"
      - "tests/mahluk-universal-hygiene.test.cjs"
      - "tests/mahluk-template-runtime.test.cjs"
      - "tests/mahluk-appearance-runtime.test.cjs"
      - "tests/membangun-live-sync.test.cjs"
      - "tests/bangun-ruang-*.test.cjs"
      - "tests/semesta-traffic.test.cjs"
      - "tests/semesta-vehicle-queue.test.cjs"
      - "tests/semesta-vehicle-visuals.test.cjs"
      - "tests/semesta-vehicle-flip.test.cjs"
      - "tests/semesta-pan-tool.test.cjs"
      - "tests/semesta-clean-ui-menus.test.cjs"
      - "tests/semesta-tree-replacement.test.cjs"
      - "tests/semesta-placeholder-replacement.test.cjs"
      - "tests/semesta-kebon-sirih-style.test.cjs"
      - "tests/semesta-pipeline-grounding.test.cjs"
      - "tests/semesta-asset-thumbnails.test.cjs"
      - "tests/semesta-active-asset-camera.test.cjs"
      - "tests/semesta-simple-effects.test.cjs"
      - "tests/semesta-daynight.test.cjs"
      - "tests/semesta-sidewalk-and-lighting.test.cjs"
      - "tests/world-builder-v2.test.cjs"
      - ".github/workflows/semesta-mahluk-sync.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Semesta
        uses: actions/checkout@v4
      - name: Check Mahluk Hidup sync and world builder scripts
        run: |
          node --check world-builder/mahluk-hidup-bridge.js
          node --check world-builder/pipeline-character-rig.js
          node --check world-builder/style-rules.js
          node --check world-builder/tree-replacement.js
          node --check world-builder/placeholder-replacement.js
          node --check world-builder/kebon-sirih-style.js
          node --check world-builder/semesta-pipeline-ground.js
          node --check world-builder/asset-thumbnails.js
          node --check world-builder/bangun-ruang/object-bridge.js
          node --check world-builder/bangun-ruang/pixel-object-creator.js
          node --check world-builder/map-schema.js
          node --check world-builder/semesta-vehicle-placement.js
          node --check world-builder/semesta-world-effects.js
          node --check world-builder/semesta-traffic-art.js
          node --check world-builder/active-asset-camera.js
          node --input-type=module --check < world-builder/builder.js
      - name: Mahluk Hidup catalog, frames and custom equipment integration
        run: |
          node tests/jiwa-base-human-gameplay.test.cjs
          node tests/semesta-custom-wardrobe-depth.test.cjs
          node tests/semesta-base-human-gameplay.test.cjs
          node tests/semesta-mahluk-sync.test.cjs
          node tests/mahluk-action-frame-sync.test.cjs
          node --test tests/mahluk-universal-hygiene.test.cjs
          node tests/mahluk-template-runtime.test.cjs
          node tests/mahluk-appearance-runtime.test.cjs
      - name: Bangun Ruang exterior/interior scale and WC regressions
        run: |
          node --test tests/bangun-ruang-shared-scale-v7.test.cjs tests/bangun-ruang-isometric-interior.test.cjs tests/bangun-ruang-toilet-seat-alignment.test.cjs tests/bangun-ruang-character-door-wc-v8.test.cjs tests/bangun-ruang-source-game-v9.test.cjs
      - name: Saved Bangun Ruang interaction placement and gizmo regression
        run: |
          node --test tests/bangun-ruang-action-adjustment.test.cjs tests/bangun-ruang-action-gizmo.test.cjs tests/bangun-ruang-adjustment-persistence.test.cjs tests/bangun-ruang-type-action-presets.test.cjs
          node --check world-builder/bangun-ruang/warteg-kharisma-template.js
          node --check world-builder/bangun-ruang/warteg-interior-paint.js
          node --test tests/bangun-ruang-warteg-pipeline.test.cjs tests/bangun-ruang-warteg-3d.test.cjs
          node --check world-builder/warteg-3d.js
          node --check world-builder/bangun-ruang/semesta-interior-preview.js
          node --check world-builder/bangun-ruang/studio-interior-ui.js
          node --check world-builder/city-building-link.js
          node --check world-builder/bangun-ruang/city-browser.js
          node --test tests/bangun-ruang-city-sync.test.cjs
          node --check world-builder/bangun-ruang/action-adjustment.js
      - name: Launcher desktop and navigation validation
        run: node --test tests/membangun-launcher.test.cjs
      - name: Live Membangun app sync regression
        run: |
          node --test tests/bangun-ruang-bridge.test.cjs tests/bangun-ruang-object-bridge.test.cjs tests/bangun-ruang-pixel-creator.test.cjs tests/membangun-live-sync.test.cjs
          node --check world-builder/studio-sprite-grounding.js
          node --test tests/bangun-ruang-grounding.test.cjs
          node --check world-builder/bangun-ruang/semesta-bridge.js
          node --check world-builder/bangun-ruang/character-scale-preview.js
      - name: Semesta existing world and traffic regressions
        run: |
          node tests/world-builder-v2.test.cjs
          node --check world-builder/semesta-wheel-ground.js
          node --check world-builder/semesta-traffic-art.js
          node --test tests/semesta-wheel-ground.test.cjs
          node --test tests/semesta-clean-ui-menus.test.cjs
          node --check world-builder/semesta-vegetation-ground.js
          node --test tests/semesta-vegetation-ground.test.cjs
          node tests/semesta-mahluk-vehicles.test.cjs
          node tests/semesta-movement-grounding.test.cjs
          node tests/semesta-traffic.test.cjs
          node tests/semesta-vehicle-queue.test.cjs
          node tests/semesta-vehicle-visuals.test.cjs
          node tests/semesta-vehicle-flip.test.cjs
          node tests/semesta-pan-tool.test.cjs
          node --test tests/semesta-tree-replacement.test.cjs tests/semesta-placeholder-replacement.test.cjs tests/semesta-kebon-sirih-style.test.cjs tests/semesta-pipeline-grounding.test.cjs tests/semesta-asset-thumbnails.test.cjs
          node tests/semesta-active-asset-camera.test.cjs
          node tests/semesta-simple-effects.test.cjs
          node tests/semesta-daynight.test.cjs
          node tests/semesta-sidewalk-and-lighting.test.cjs
