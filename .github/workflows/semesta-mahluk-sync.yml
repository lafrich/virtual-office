name: Semesta + Mahluk Hidup — Sync Validation

on:
  push:
    branches:
      - main
    paths:
      - "world-builder/**"
      - "tests/semesta-mahluk-sync.test.cjs"
      - "tests/membangun-live-sync.test.cjs"
      - "tests/semesta-traffic.test.cjs"
      - "tests/semesta-vehicle-queue.test.cjs"
      - "tests/world-builder-v2.test.cjs"
      - ".github/workflows/semesta-mahluk-sync.yml"
  pull_request:
    paths:
      - "world-builder/**"
      - "tests/semesta-mahluk-sync.test.cjs"
      - "tests/membangun-live-sync.test.cjs"
      - "tests/semesta-traffic.test.cjs"
      - "tests/semesta-vehicle-queue.test.cjs"
      - "tests/world-builder-v2.test.cjs"
      - ".github/workflows/semesta-mahluk-sync.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Semesta
        uses: actions/checkout@v4
      - name: Check Mahluk Hidup sync and world builder scripts
        run: |
          node --check world-builder/mahluk-hidup-bridge.js
          node --check world-builder/pipeline-character-rig.js
          node --check world-builder/style-rules.js
          node --check world-builder/map-schema.js
          node --input-type=module --check < world-builder/builder.js
      - name: Mahluk Hidup catalog, frames and custom equipment integration
        run: node tests/semesta-mahluk-sync.test.cjs
      - name: Bangun Ruang exterior/interior scale and WC regressions
        run: |
          node --test tests/bangun-ruang-shared-scale-v7.test.cjs tests/bangun-ruang-isometric-interior.test.cjs tests/bangun-ruang-toilet-seat-alignment.test.cjs tests/bangun-ruang-character-door-wc-v8.test.cjs tests/bangun-ruang-source-game-v9.test.cjs
      - name: Live Membangun app sync regression
        run: |
          node --test tests/bangun-ruang-bridge.test.cjs tests/membangun-live-sync.test.cjs
          node --check world-builder/bangun-ruang/semesta-bridge.js
          node --check world-builder/bangun-ruang/character-scale-preview.js
      - name: Semesta existing world and traffic regressions
        run: |
          node tests/world-builder-v2.test.cjs
          node tests/semesta-traffic.test.cjs
          node tests/semesta-vehicle-queue.test.cjs
