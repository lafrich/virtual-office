name: Mainkan Nokia + Jiwa live browser check
on:
  push:
    branches: [main]
    paths:
      - "shared/vl-hud/phone_ellen.js"
      - "shared/vl-hud/nokia-play.js"
      - "shared/play-hud.js"
      - "world-builder/semesta-life-play.js"
      - "world-builder/builder.js"
      - "world-builder/index.html"
      - "jiwa/life-economy.js"
      - "tests/nokia-live-browser.e2e.cjs"
      - ".github/workflows/semesta-nokia-live.yml"
  pull_request:
    paths:
      - "mainkan/**"
      - "world-builder/builder.js"
      - "world-builder/semesta-life-play.js"
      - "tests/nokia-live-browser.e2e.cjs"
      - ".github/workflows/semesta-nokia-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout Mainkan and native Semesta runtime
        uses: actions/checkout@v4
        with:
          path: virtual-office
      - name: Checkout native asset pipeline
        uses: actions/checkout@v4
        with:
          repository: lafrich/virtual-life-asset-pipeline
          path: virtual-life-asset-pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Link approved Genesis and Emosi art into the same-origin preview
        run: |
          ln -s site/media virtual-life-asset-pipeline/media
          ln -s site/v6p-compositor.js virtual-life-asset-pipeline/v6p-compositor.js
          ln -s site/genesis-source.js virtual-life-asset-pipeline/genesis-source.js
          ln -s site/emosi-source.js virtual-life-asset-pipeline/emosi-source.js
          # Mainkan uses LGR-1 by default; old V6P-only fixtures left the player
          # permanently waiting for a first frame in all three browser suites.
          for file in lafrich-puppet-core.js lafrich-puppet-renderer.js lgr1-raster.js lgr1-motion.js lgr-skin.js lgr-wear.js lgr-actor.js lgr-db.js lgr-game.js; do
            ln -s "site/$file" "virtual-life-asset-pipeline/$file"
          done
          test -f virtual-life-asset-pipeline/lgr-game.js
          test -f virtual-life-asset-pipeline/media/lgr1/base/index.json
          test -f virtual-life-asset-pipeline/media/lgr1/motions.json
      - name: Serve app and renderer from the same origin
        run: |
          python3 -m http.server 8091 --bind 127.0.0.1 >/tmp/nokia-semesta-server.log 2>&1 &
          sleep 2
      - name: "Check Mainkan player: buy token, Dompet, activity pins, actor position"
        run: node virtual-office/tests/nokia-live-browser.e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nokia-jiwa-real-browser
          path: screenshots/
          if-no-files-found: ignore
