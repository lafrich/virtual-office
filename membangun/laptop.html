<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071d55">
<meta name="color-scheme" content="only light">
<title>Membangun — Mini Laptop</title>
<style>
:root{font-family:Tahoma,"MS Sans Serif",Verdana,Arial,sans-serif;color:#192338;--xp:#d6d5ce;--line:#75859a;--blue:#154c9f;--paper:#f9f9f3}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#08245c;font-size:12px}
button,input,select{font:inherit}
button{touch-action:manipulation;cursor:pointer;color:#152840;border:1px solid #899aaf;border-top-color:#fff;border-left-color:#fff;border-radius:2px;background:linear-gradient(#fff,#d3dbe5);padding:5px 9px;white-space:nowrap}
button:active,button.active{background:linear-gradient(#b7d5ff,#e2eaff);border-color:#3765a2}
button:disabled{opacity:.4}
button:focus-visible{outline:2px solid #f5b450;outline-offset:2px}
a{color:inherit}
[hidden]{display:none!important}
.laptop{display:grid;grid-template-rows:minmax(0,1fr) 9px minmax(0,1fr);width:100dvw;height:100dvh;max-height:100dvh;overflow:hidden}
body.rotated .laptop{position:fixed;left:100dvw;top:0;width:100dvh;height:100dvw;max-height:none;transform-origin:top left;transform:rotate(90deg)}
.display{background:#ece9d8;display:flex;flex-direction:column;min-height:0;overflow:hidden;border:2px solid #183d86}
.topbar{background:linear-gradient(180deg,#5aafff,#1a70d5 22%,#083f9f 75%,#0b3990);color:white;display:flex;align-items:center;gap:8px;padding:4px 8px;height:36px;flex:none}
.brand{font-size:13px;font-weight:bold;letter-spacing:.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{font-size:9px;font-weight:normal;margin-left:4px;letter-spacing:0}
.topbar .right{margin-left:auto;display:flex;gap:5px;align-items:center}
.topbar button{font-size:11px;min-height:26px}
.topbar .close{background:linear-gradient(#e88c80,#b82825);color:white;border-color:#f7b6ae #7b1c1c #7b1c1c #f7b6ae}
.apps{height:35px;flex:none;display:flex;align-items:stretch;gap:2px;padding:4px 5px 0;background:#cfd7e4;border-bottom:1px solid #8296b1;overflow-x:auto;scrollbar-width:none}
.apps button{border-bottom:0;border-radius:5px 5px 0 0;font-size:10px;font-weight:bold;padding:4px 10px;min-width:95px}
.apps button.active{background:#f7f8f4;border-bottom-color:#f7f8f4;color:#153e83}
.screen-shell{flex:1;position:relative;min-height:0;overflow:hidden;background:#b1b8c2}
.screen-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#5b84bc #cdd8e8;touch-action:pan-x pan-y}
.frame-wrap{position:relative;transform-origin:0 0}
.embedded-frame{display:block;position:absolute;top:0;left:0;transform-origin:0 0;border:0;background:#fff}
#cursor{position:absolute;left:50%;top:50%;width:22px;height:27px;pointer-events:none;z-index:6;filter:drop-shadow(1px 2px 1px #101c3290)}
#cursor svg{width:100%;height:100%}
.viewport-nav{position:absolute;right:4px;top:50%;transform:translateY(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 3px;background:#e2e9f2e8;border:1px solid #778fae;border-radius:6px;box-shadow:0 1px 5px #10294b30}
.viewport-nav button{width:26px;height:28px;min-width:26px;padding:0;font-size:17px;font-weight:bold;line-height:1}
.viewport-nav .progress{font:9px "Courier New",monospace;color:#324e75;font-weight:bold;min-width:26px;text-align:center}
.viewport-nav button:disabled{opacity:.32}
.placeholder{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#eff3fa;color:#42556e;padding:20px;text-align:center}
.placeholder strong{display:block;color:#1e3f83;margin-bottom:6px;font-size:16px}
.placeholder a{display:inline-block;margin-top:9px;background:#d8e9ff;padding:8px}
.display-status{height:23px;flex:none;background:#e1e5e7;border-top:1px solid #f9ffff;display:flex;align-items:center;gap:8px;padding:0 8px;color:#536377;font:10px "Courier New",monospace;white-space:nowrap;overflow:hidden}
.display-status .name{font-weight:bold;color:#194b99}
.display-status #bridgeStatus{overflow:hidden;text-overflow:ellipsis}
.hinge{background:linear-gradient(180deg,#354052,#181e2d 35%,#7e8490 51%,#151e2d 70%,#354052);position:relative}
.hinge:after{content:"";width:17%;position:absolute;left:41.5%;top:3px;height:3px;border-radius:4px;background:#a5aab4}
.controls{min-height:0;display:flex;flex-direction:column;background:#c8d3e4;overflow:hidden;border:2px solid #183d86;border-top:0}
.controlsbar{flex:none;min-height:33px;background:linear-gradient(#eaf3ff,#cbd7e8);border-bottom:1px solid #90a1ba;display:flex;align-items:center;gap:6px;padding:5px 8px;overflow-x:auto;scrollbar-width:none}
.controlsbar button{min-height:25px;font-weight:bold;font-size:10px}
.controlsbar .small{padding:5px 7px}
.controlsbar .spacer{flex:1}
.controlsbar .mode{border-color:#6e84a4}
.controlsbar .controls-label{font-size:10px;font-weight:bold;color:#23456f;white-space:nowrap}.controlsbar .mode.active{background:#8eace1;color:#0a306f}
.quick-apps{height:32px;flex:none;display:flex;gap:3px;padding:4px 5px;align-items:stretch;overflow-x:auto;background:#bac9de;border-bottom:1px solid #91a4c2;scrollbar-width:none}
.quick-apps button{flex:1;min-width:92px;padding:3px 6px;font-size:10px;font-weight:bold}
.quick-apps button.active{background:#8eace1;color:#102d61;border-color:#42699f}
.control-area{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.keyboard-page{order:0;display:flex;flex-direction:column;flex:none;height:52%;min-height:0;max-height:220px;padding:4px 6px 6px;gap:3px;background:#c7d1df;border-bottom:1px solid #7188a6}
.key-toolbar{display:flex;align-items:center;gap:4px;height:18px;flex:none}
.key-toolbar span{font-size:9px;font-weight:bold;color:#50627a;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key-toolbar button{font-size:9px;padding:1px 8px;height:19px}
.keyboard{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));gap:3px;flex:1;min-height:0}
.key-row{display:flex;justify-content:center;gap:3px;min-height:0}
.key{flex:1;min-width:0;min-height:0;padding:0 1px;box-shadow:0 1px 0 #7889a3;font-size:clamp(10px,1.7vw,16px);font-weight:bold;touch-action:manipulation;background:linear-gradient(#f9fcff,#e0e8f2);border:1px solid #899bb4;border-radius:3px}
.key.special{flex:1.45;font-size:clamp(8px,1.05vw,11px);background:linear-gradient(#e1ebfa,#cad9ef)}
.key.space{flex:5}
.key.active{background:#7a9fd1}
.pad-page{order:1;flex:1;min-height:0;display:block;padding:4px 7px 5px}
.pad-main{height:100%;display:flex;flex-direction:column;gap:3px;min-height:0}
.hold-controls{display:flex;flex:none;justify-content:center;align-items:center;height:29px;gap:5px}
.hold-controls button{min-width:140px;max-width:210px;height:26px;padding:2px 10px;font-size:11px;font-weight:bold;border-radius:4px;background:linear-gradient(#e9f4ff,#c2d5ed)}
.hold-controls button.active{background:linear-gradient(#8ac1ff,#4c86d5);color:white;border-color:#184580}
.touchpad{position:relative;flex:1;min-height:0;touch-action:none;background:linear-gradient(125deg,#c8d3df,#eef2f7 62%,#ced9e6);border:1px solid #71869f;border-radius:8px;box-shadow:inset 2px 2px 6px #7c8da347;overflow:hidden}
.touchpad:before{content:"";position:absolute;inset:7px;border:1px solid #a3b1c1;border-radius:5px;pointer-events:none}
.touchpad:after{content:"";position:absolute;top:44%;left:48%;width:13px;height:13px;border-right:1px solid #99a9b9;border-bottom:1px solid #99a9b9;transform:rotate(45deg);opacity:.24;pointer-events:none}
.pad-hint{position:absolute;left:13px;top:7px;color:#637a99;font:9px/1.35 "Courier New",monospace;user-select:none;pointer-events:none}
#nativeInput{width:1px;height:1px;position:absolute;opacity:0;pointer-events:none}
.toast{position:absolute;z-index:8;bottom:9px;left:50%;transform:translateX(-50%);background:#203d6b;color:#fff;padding:7px 12px;border-radius:4px;max-width:90%;text-align:center;font:11px Tahoma,sans-serif;box-shadow:0 2px 7px #0006;pointer-events:none}
@media (orientation:portrait){.laptop{grid-template-rows:minmax(0,1fr) 7px minmax(0,1fr)}.brand small{display:none}.apps button{min-width:100px}}
@media(max-width:470px){.topbar{gap:3px;padding:3px}.brand{font-size:11px}.topbar button{padding:4px 6px}.controlsbar{gap:3px;padding:4px}.controlsbar button{padding:3px 5px}.key-row{gap:2px}.key{font-size:10px}.keyboard-page{height:52%;min-height:0}.pad-hint{font-size:9px}}
</style>
</head>
<body>
<div class="laptop" id="laptop">
 <section class="display" aria-label="Tampilan aplikasi desktop">
  <header class="topbar">
   <div class="brand">✳ MEMBANGUN.EXE <small>MINI LAPTOP MODE</small></div>
   <div class="right">
    <button id="zoomOut" title="Perkecil seluruh viewport laptop (bukan zoom denah)">−</button><span id="zoomText" aria-label="Zoom">FIT</span>
    <button id="zoomIn" title="Perbesar seluruh viewport laptop (bukan zoom denah)">＋</button>
    <button id="rotate90" title="Putar 90 derajat jika browser tidak mau landscape">↻90°</button>
    <button id="fullscreen" title="Mode layar penuh">⛶</button>
    <button class="close" id="exit" title="Kembali ke Membangun">×</button>
   </div>
  </header>
  <nav class="apps" id="appTabs" aria-label="Pindah aplikasi"></nav>
  <div class="screen-shell" id="screenShell">
   <div class="screen-scroll" id="screenScroll" aria-label="Area layar desktop yang dapat digulir ke atas dan bawah"><div class="frame-wrap" id="frameWrap"><iframe id="appFrame" class="embedded-frame" title="Aplikasi desktop" allow="clipboard-read; clipboard-write; fullscreen"></iframe></div></div>
   <div class="viewport-nav" aria-label="Gulir layar desktop">
    <button type="button" id="screenUp" title="Geser tampilan layar ke atas">⌃</button>
    <span class="progress" id="screenProgress">0%</span>
    <button type="button" id="screenDown" title="Geser tampilan layar ke bawah">⌄</button>
   </div>
   <div id="cursor" aria-hidden="true"><svg viewBox="0 0 24 29"><path d="M2 1v24l6-7 4 9 5-3-5-9h9z" fill="#fff" stroke="#162037" stroke-width="2" stroke-linejoin="round"/></svg></div>
   <div class="placeholder" id="placeholder"><div><strong>MEMBANGUN / MINI LAPTOP</strong><span id="placeholderText">Memuat aplikasi desktop...</span><div><a id="externalFallback" href="#" target="_blank" rel="noopener">Buka aplikasi di tab baru</a></div></div></div>
   <div class="toast" id="toast" hidden></div>
  </div>
  <footer class="display-status"><span class="name" id="currentApp">SEMESTA.EXE</span><span id="bridgeStatus">Mouse & keyboard siap</span></footer>
 </section>
 <div class="hinge" aria-hidden="true"></div>
 <section class="controls" aria-label="Touchpad dan keyboard virtual">
  <div class="controlsbar">
   <span class="controls-label">⌨ MINI LAPTOP · QWERTY + TOUCHPAD</span>
   <span class="spacer"></span>
   <button class="small" id="undoKey" title="Ctrl+Z">↶ UNDO</button>
   <button class="small" id="escapeKey" title="Esc">ESC</button>
   <button class="small" id="external" title="Buka aplikasi langsung">↗ APP</button>
  </div>
  <nav id="quickApps" class="quick-apps" aria-label="Buka aplikasi dari layar touchpad"></nav>
  <div class="control-area">
   <div class="keyboard-page" id="keyboardPage">
    <div class="key-toolbar">
     <span>ESC · 1–0 · QWERTY · SHIFT · CTRL · SPACE · ↵</span>
     <button id="pasteKey" title="Paste dari clipboard">PASTE</button>
     <button id="copyKey" title="Copy selection">COPY</button>
    </div>
    <div class="keyboard" id="keyboard" aria-label="Keyboard laptop virtual"></div>
   </div>
   <div class="pad-page" id="padPage">
    <div class="pad-main">
     <div class="touchpad" id="touchpad" aria-label="Tap sekali klik kiri, tap dua kali untuk mengunci atau melepas tahan klik, geser satu jari untuk pan saat HOLD menyala" role="application">
      <div class="pad-hint">1 TAP: KLIK · 2 TAP: HOLD ON/OFF<br>HOLD + GESER: PAN · PINCH: ZOOM DENAH</div>
     </div>
     <div class="hold-controls">
      <button type="button" id="holdClick" aria-pressed="false" aria-label="Aktifkan atau lepas tahan klik untuk pan">✥ HOLD OFF · 2× TAP</button>
     </div>
    </div>
   </div>
   <textarea id="nativeInput" aria-label="Input keyboard sistem" autocomplete="off"></textarea>
  </div>
 </section>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const apps=[
 {id:'mahluk',label:'MAHLUK HIDUP',url:'https://lafrich.github.io/virtual-life-asset-pipeline/'},
 {id:'emotion',label:'EMOSI',url:'https://lafrich.github.io/virtual-office/emotion-studio/'},
 {id:'bangun',label:'BANGUN RUANG',url:'https://lafrich.github.io/virtual-office/world-builder/bangun-ruang/'},
 {id:'semesta',label:'SEMESTA',url:'https://lafrich.github.io/virtual-office/world-builder/'},
 {id:'jiwa',label:'JIWA',url:'https://lafrich.github.io/virtual-office/jiwa/'}
];
const params=new URLSearchParams(location.search);
let selected=apps.find(a=>a.id===params.get('app'))?.id || 'semesta';
let zoom=1,scale=1,frameWidth=1180,frameHeight=660,rotated=false;
let cx=0,cy=0,pressed=false,dragTarget=null,holdLocked=false,restoreSemestaMode=null,shift=false,symbols=false,ctrl=false;
let canBridge=false,lastFocus=null,toastTimer=null,longPressTimer=null,tapTimer=null,lastTap=null;
let frame=$('appFrame');const liveFrames=new Map(), loadedFrames=new Set(),shell=$('screenShell'),scroller=$('screenScroll'),cursor=$('cursor');
const getApp=()=>apps.find(a=>a.id===selected);
const getUrl=(id)=>{const def=apps.find(a=>a.id===id)?.url||'';try{return localStorage.getItem('membangun-link-'+id)||def}catch{return def}};
function message(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2100)}
function currentDocument(){try{const doc=frame.contentDocument;if(doc&&doc.defaultView&&doc.defaultView.location.origin===location.origin)return doc}catch{}return null}
function frameWindow(){try{return currentDocument()?.defaultView||null}catch{return null}}
function screenRect(){return shell.getBoundingClientRect()}
function setCursor(x,y){cx=Math.max(1,Math.min(shell.clientWidth-2,x));cy=Math.max(1,Math.min(shell.clientHeight-2,y));cursor.style.left=cx+'px';cursor.style.top=cy+'px'}
function layout(){
 const oldWidth=frameWidth;
 const shellWidth=shell.clientWidth,shellHeight=shell.clientHeight;
 if(!shellWidth||!shellHeight)return;
 frameWidth=1180;
 scale=(shellWidth/frameWidth)*zoom;
 frameHeight=Math.max(1050,Math.ceil(shellHeight/scale)+260);
 $('frameWrap').style.width=(frameWidth*scale)+'px';
 $('frameWrap').style.height=(frameHeight*scale)+'px';
 for(const f of [frame,...liveFrames.values()]){
  f.style.width=frameWidth+'px';
  f.style.height=frameHeight+'px';
  f.style.transform='scale('+scale+')';
 }
 $('zoomText').textContent=Math.round(zoom*100)+'%';
 requestAnimationFrame(updateScreenProgress);
 if(oldWidth!==frameWidth||cx===0)setCursor(shellWidth*.5,shellHeight*.45);
 else setCursor(cx,cy);
}
function updateScreenProgress(){
 const max=Math.max(0,scroller.scrollHeight-scroller.clientHeight);
 const y=Math.min(max,Math.max(0,scroller.scrollTop));
 $('screenProgress').textContent=max>1?Math.round(y/max*100)+'%':'FIT';
 $('screenUp').disabled=y<=1;
 $('screenDown').disabled=y>=max-1;
}
function panScreen(deltaY,deltaX=0){
 const maxY=Math.max(0,scroller.scrollHeight-scroller.clientHeight);
 const maxX=Math.max(0,scroller.scrollWidth-scroller.clientWidth);
 if(maxY>1)scroller.scrollTop=Math.min(maxY,Math.max(0,scroller.scrollTop+deltaY));
 if(maxX>1)scroller.scrollLeft=Math.min(maxX,Math.max(0,scroller.scrollLeft+deltaX));
 updateScreenProgress();
}
function gestureDelta(dx,dy){return rotated?{dx:dy,dy:-dx}:{dx,dy}}
function pointInFrame(){
 const x=(cx+scroller.scrollLeft)/scale,y=(cy+scroller.scrollTop)/scale;
 return {x:Math.min(frameWidth-1,Math.max(0,x)),y:Math.min(frameHeight-1,Math.max(0,y))};
}
function targetAt(){
 const doc=currentDocument();if(!doc)return null;
 const pt=pointInFrame();
 return doc.elementFromPoint(pt.x,pt.y)||doc.body;
}
function sendPointer(type,element,button=0,buttons=0){
 const doc=currentDocument();if(!doc||!element)return;
 const w=doc.defaultView,pt=pointInFrame();
 try{
  if(typeof w.PointerEvent==='function'){
   element.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,composed:true,clientX:pt.x,clientY:pt.y,button,buttons,pointerId:1,pointerType:'mouse',isPrimary:true}));
  }
  const map={pointerdown:'mousedown',pointermove:'mousemove',pointerup:'mouseup',pointerover:'mouseover',pointerout:'mouseout'};
  if(map[type])element.dispatchEvent(new w.MouseEvent(map[type],{bubbles:true,cancelable:true,composed:true,view:w,clientX:pt.x,clientY:pt.y,button,buttons}));
 }catch(e){console.warn('Mouse event failed',e)}
}
function movePointer(){
 if(!canBridge)return;
 // Keep pointermove aimed at the original pressed surface while dragging.
 // Synthetic events cannot rely on native pointer capture across an iframe.
 const target=pressed&&dragTarget?dragTarget:targetAt();
 sendPointer('pointermove',target,0,pressed?1:0);
}
function pressMouse(button=0){
 if(!canBridge){message('Mouse hanya tersedia untuk aplikasi dari lafrich.github.io');return}
 if(pressed)return;
 const doc=currentDocument();
 const t=holdLocked&&selected==='semesta'?(doc?.getElementById('world')||targetAt()):targetAt();
 if(!t)return;
 pressed=true;dragTarget=t;
 sendPointer('pointerdown',t,button,button===2?2:1);
 if(t.focus&&button===0)try{t.focus({preventScroll:true})}catch{}
}
function releaseMouse(button=0){
 if(!pressed)return;
 const target=dragTarget||targetAt();
 sendPointer('pointerup',target,button,0);
 pressed=false;dragTarget=null;
}
function setHold(value){
 const next=!!value;
 if(holdLocked===next)return;
 if(next){
  if(!canBridge){message('Buka aplikasi terlebih dahulu');return}
  holdLocked=true;
  // Semesta's Pan tool accepts drags even above existing placed objects.
  // Temporarily activate it only for the duration of HOLD.
  if(selected==='semesta'){
   const doc=currentDocument();
   const pan=doc?.getElementById('panMode');
   const prior=[...doc?.querySelectorAll('[id$="Mode"][aria-pressed="true"]')||[]]
      .find(b=>b.id!=='panMode');
   restoreSemestaMode=pan&&!pan.classList.contains('active')?prior?.id||'selectMode':null;
   if(pan&&!pan.classList.contains('active'))pan.click();
  }
  pressMouse(0);
  if(!pressed){holdLocked=false;restoreSemestaMode=null;return}
 }else{
  // Release at the same canvas where the drag began.
  releaseMouse(0);holdLocked=false;
  if(selected==='semesta'&&restoreSemestaMode){
   currentDocument()?.getElementById(restoreSemestaMode)?.click();
  }
  restoreSemestaMode=null;
 }
 $('holdClick').classList.toggle('active',holdLocked);
 $('holdClick').setAttribute('aria-pressed',String(holdLocked));
 $('holdClick').textContent=holdLocked?'✥ HOLD ON · 2× TAP':'✥ HOLD OFF · 2× TAP';
 $('holdClick').title=holdLocked?'Gerakkan kursor untuk pan. Double tap untuk melepas.':'Double tap pada touchpad untuk mengunci klik kiri.';
}
function clickMouse(button=0){
 if(!canBridge){message('Gunakan tombol ↗ APP untuk aplikasi eksternal');return}
 const t=targetAt();if(!t)return;
 if(button===2){
  const doc=currentDocument(),w=doc.defaultView,p=pointInFrame();
  const ev=new w.MouseEvent('contextmenu',{bubbles:true,cancelable:true,view:w,button:2,buttons:2,clientX:p.x,clientY:p.y});
  t.dispatchEvent(ev);
  return;
 }
 pressMouse(0);releaseMouse(0);
 const doc=currentDocument(),w=doc.defaultView,p=pointInFrame();
 t.dispatchEvent(new w.MouseEvent('click',{bubbles:true,cancelable:true,view:w,button:0,buttons:0,clientX:p.x,clientY:p.y}));
 if(t.closest&&t.closest('input,textarea,[contenteditable="true"]'))lastFocus=t.closest('input,textarea,[contenteditable="true"]');
}
function scrollContent(deltaY,deltaX=0){
 const doc=currentDocument();if(!doc)return;
 const target=targetAt(),w=doc.defaultView,pt=pointInFrame();
 // A synthetic WheelEvent does not trigger the browser's default scrolling.
 // Existing editors can listen to wheel (canvas zoom/pan), but normal HTML
 // scroll containers must also be scrolled explicitly.
 let handledByApp=false;
 if(target&&typeof w.WheelEvent==='function'){
  try{
   const ev=new w.WheelEvent('wheel',{bubbles:true,cancelable:true,composed:true,view:w,clientX:pt.x,clientY:pt.y,deltaY,deltaX,deltaMode:0});
   handledByApp=!target.dispatchEvent(ev);
  }catch(err){console.warn('wheel dispatch',err)}
 }
 let scrollable=null,n=target;
 while(n&&n!==doc){
  if(n.nodeType===1){
   const style=w.getComputedStyle(n);
   const vertical=/(auto|scroll|overlay)/.test(style.overflowY)&&n.scrollHeight>n.clientHeight+2;
   const horizontal=/(auto|scroll|overlay)/.test(style.overflowX)&&n.scrollWidth>n.clientWidth+2;
   if(vertical||horizontal){scrollable=n;break}
  }
  n=n.parentNode;
 }
 if(scrollable){
  // Do not stop just because a custom handler called preventDefault.
  // The untrusted WheelEvent will not perform native scrolling itself.
  scrollable.scrollTop+=deltaY;
  scrollable.scrollLeft+=deltaX;
  return;
 }
 if(handledByApp)return; // Preserve canvas zoom / wheel-based editor tools.
 const root=doc.scrollingElement||doc.documentElement;
 if(root&&root.scrollHeight>root.clientHeight+2){
  root.scrollTop+=deltaY;root.scrollLeft+=deltaX;
 }else if(doc.body&&doc.body.scrollHeight>doc.body.clientHeight+2){
  doc.body.scrollTop+=deltaY;doc.body.scrollLeft+=deltaX;
 }
}
// Bridge pinch from the physical touchpad to the ACTIVE app's own zoom
// handler. Never scale the laptop iframe when pinching.
// Semesta listens for wheel on canvas#world; other studios can handle
// ctrl+wheel on their hovered canvas/editor surface.
function zoomInsideApp(direction){
 const doc=currentDocument();if(!doc)return false;
 const w=doc.defaultView,pt=pointInFrame();
 let target=targetAt();
 if(selected==='semesta'){
  target=doc.getElementById('world')||target;
 }else if(target){
  target=target.closest?.('canvas,svg,[data-zoom-canvas],[data-editor-viewport]')||target;
 }
 if(!target||typeof w.WheelEvent!=='function')return false;
 const rect=target.getBoundingClientRect();
 const onSurface=pt.x>=rect.left&&pt.x<=rect.right&&pt.y>=rect.top&&pt.y<=rect.bottom;
 const x=selected==='semesta'&&!onSurface?rect.left+rect.width/2:pt.x;
 const y=selected==='semesta'&&!onSurface?rect.top+rect.height/2:pt.y;
 const deltaY=direction>0?-80:80; // fingers apart = zoom in
 try{
  target.dispatchEvent(new w.WheelEvent('wheel',{
   bubbles:true,cancelable:true,composed:true,view:w,clientX:x,clientY:y,
   deltaX:0,deltaY,deltaMode:0,ctrlKey:true
  }));
  return true;
 }catch(err){console.warn('App pinch bridge',err);return false}
}
function focusDoc(){
 const doc=currentDocument();if(!doc)return null;
 if(lastFocus&&lastFocus.isConnected)return lastFocus;
 const active=doc.activeElement;
 return active&&active!==doc.body?active:doc.body;
}
function keyEvent(type,key,code=key){
 const doc=currentDocument();if(!doc){message('Keyboard tidak dapat mengontrol situs lintas origin');return null}
 const target=focusDoc(),w=doc.defaultView;
 const evt=new w.KeyboardEvent(type,{key,code,bubbles:true,cancelable:true,composed:true,shiftKey:shift,ctrlKey:ctrl,view:w});
 target.dispatchEvent(evt);
 return {target,prevented:evt.defaultPrevented};
}
function putText(target,text){
 const doc=currentDocument();if(!doc)return;
 if(target instanceof doc.defaultView.HTMLInputElement||target instanceof doc.defaultView.HTMLTextAreaElement){
  if(target.readOnly||target.disabled)return;
  const a=target.selectionStart??target.value.length,b=target.selectionEnd??a;
  const isDelete=text==='__BACKSPACE__';
  const start=isDelete&&a===b?Math.max(0,a-1):a;
  target.setRangeText(isDelete?'':text,start,b,'end');
  target.dispatchEvent(new doc.defaultView.InputEvent('input',{bubbles:true,inputType:isDelete?'deleteContentBackward':'insertText',data:isDelete?null:text}));
  return;
 }
 if(target.isContentEditable){
  target.focus();
  doc.execCommand(text==='__BACKSPACE__'?'delete':'insertText',false,text==='__BACKSPACE__'?'':text);
 }
}
function stepFocus(){
 const doc=currentDocument();if(!doc)return;
 const list=[...doc.querySelectorAll('input:not([disabled]),textarea:not([disabled]),select:not([disabled]),button:not([disabled]),a[href],[contenteditable="true"]')].filter(el=>el.getClientRects().length);
 if(!list.length)return;
 const index=list.indexOf(focusDoc());
 const next=list[(index+(shift?-1:1)+list.length)%list.length];
 next.focus({preventScroll:true});lastFocus=next;
}
function applyKey(key){
 const normalized=key==='SPACE'?' ':key==='BACKSPACE'?'Backspace':key==='ENTER'?'Enter':key==='TAB'?'Tab':key==='ESC'?'Escape':key;
 if(key==='SHIFT'){shift=!shift;renderKeyboard();return}
 if(key==='SYM'){symbols=!symbols;renderKeyboard();return}
 if(key==='CTRL'){ctrl=!ctrl;renderKeyboard();return}
 if(key==='ALT')return
 const target=focusDoc();
 const down=keyEvent('keydown',normalized,normalized.length===1?'Key'+normalized.toUpperCase():normalized);
 if(!down)return;
 if(!down.prevented&&!ctrl){
  if(key==='TAB')stepFocus();
  else if(key==='BACKSPACE')putText(target,'__BACKSPACE__');
  else if(key==='ENTER'){
   if(target&&target.tagName==='TEXTAREA')putText(target,'\n');
   else if(target&&target.tagName==='INPUT'&&target.form){try{target.form.requestSubmit()}catch{}}
  }
  else if(normalized.startsWith('Arrow')){
   if(target&&typeof target.selectionStart==='number'){
    let n=target.selectionStart+(normalized==='ArrowLeft'?-1:normalized==='ArrowRight'?1:0);n=Math.max(0,Math.min(target.value.length,n));target.setSelectionRange(n,n);
   }
  }
  else if(normalized.length===1)putText(target,shift?normalized.toUpperCase():normalized);
 }
 keyEvent('keyup',normalized,normalized.length===1?'Key'+normalized.toUpperCase():normalized);
 if(shift&&key!=='SHIFT'){shift=false;renderKeyboard()}
 if(ctrl){ctrl=false;renderKeyboard()}
}
const letterRows=[
 ['ESC','1','2','3','4','5','6','7','8','9','0','BACKSPACE'],
 ['q','w','e','r','t','y','u','i','o','p'],
 ['a','s','d','f','g','h','j','k','l','ENTER'],
 ['SHIFT','z','x','c','v','b','n','m',',','.','ArrowUp'],
 ['CTRL','ALT','SYM','SPACE','ArrowLeft','ArrowDown','ArrowRight']
];
const symbolRows=[
 ['ESC','1','2','3','4','5','6','7','8','9','0','BACKSPACE'],
 ['!','@','#','$','%','^','&','*','(',')'],
 ['-','_','+','=','[',']','{','}','/','ENTER'],
 ['SHIFT',';',':',"'",'"','?','<','>',',','.','ArrowUp'],
 ['CTRL','ALT','SYM','SPACE','ArrowLeft','ArrowDown','ArrowRight']
];
function renderKeyboard(){
 $('keyboard').replaceChildren();
 (symbols?symbolRows:letterRows).forEach(row=>{
  const host=document.createElement('div');host.className='key-row';
  row.forEach(key=>{
   const btn=document.createElement('button');btn.type='button';btn.className='key'+(key.length>1?' special':'')+(key==='SPACE'?' space':'');
   btn.textContent=key==='BACKSPACE'?'⌫':key==='ENTER'?'↵ ENTER':key==='SPACE'?'SPACE':key==='ArrowLeft'?'←':key==='ArrowRight'?'→':key==='SHIFT'?'⇧ SHIFT':key==='SYM'?'123':key==='CTRL'?'CTRL':key==='ESC'?'ESC':key==='ALT'?'ALT':key==='ArrowUp'?'↑':key==='ArrowDown'?'↓':shift?key.toUpperCase():key;
   if((key==='SHIFT'&&shift)||(key==='SYM'&&symbols)||(key==='CTRL'&&ctrl))btn.classList.add('active');
   btn.addEventListener('pointerdown',e=>e.preventDefault());
   btn.addEventListener('click',()=>applyKey(key));host.appendChild(btn);
  });
  $('keyboard').appendChild(host);
 });
}
function setZoom(z,anchorX=shell.clientWidth/2,anchorY=shell.clientHeight/2){
 const target=Math.max(.55,Math.min(2.5,Math.round(z*100)/100));
 if(Math.abs(target-zoom)<.005)return;
 // Keep the point under the user's pinch anchored in the visible app viewport.
 const oldScale=scale||1;
 const pointX=(scroller.scrollLeft+anchorX)/oldScale;
 const pointY=(scroller.scrollTop+anchorY)/oldScale;
 zoom=target;layout();
 scroller.scrollLeft=pointX*scale-anchorX;
 scroller.scrollTop=pointY*scale-anchorY;
 updateScreenProgress();
 try{localStorage.setItem('membangun-laptop-zoom',String(zoom))}catch{}
}
function setApp(id){
 const picked=apps.find(a=>a.id===id);if(!picked)return;
 if(selected!==id&&holdLocked)setHold(false);
 else if(selected!==id&&pressed)releaseMouse();
 selected=id;lastFocus=null;canBridge=false;
 $('currentApp').textContent=picked.label+'.EXE';
 const url=getUrl(id);$('externalFallback').href=url;
 // Each tool has its own persistent embedded viewport. Switching should not reload
 // or lose unsaved editing state in the other applications.
 if(!liveFrames.has(id)){
  let next;
  if(!liveFrames.size)next=$('appFrame');
  else{
   next=document.createElement('iframe');next.className='embedded-frame';
   next.title=picked.label+'.EXE';next.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');
   $('frameWrap').appendChild(next);
  }
  liveFrames.set(id,next);
  const appId=id;
  next.addEventListener('load',()=>{
   loadedFrames.add(appId);
   if(selected===appId)onLoad();
  });
  next.addEventListener('error',()=>{if(selected===appId){$('bridgeStatus').textContent='Gagal memuat, gunakan ↗ APP';$('placeholderText').textContent='Aplikasi gagal dimuat. Buka di browser eksternal.';$('placeholder').hidden=false}});
  next.src=url;
 }
 for(const [key,f] of liveFrames)f.style.display=key===id?'block':'none';
 frame=liveFrames.get(id);
 scroller.scrollTop=0;scroller.scrollLeft=0;
 layout();
 $('placeholder').hidden=loadedFrames.has(id);
 $('placeholderText').textContent='Membuka '+picked.label+'...';
 $('bridgeStatus').textContent=loadedFrames.has(id)?'Siap':'Memuat '+picked.label+'...';
 document.querySelectorAll('[data-app]').forEach(b=>b.classList.toggle('active',b.dataset.app===id));
 if(loadedFrames.has(id))onLoad();
 const u=new URL(location.href);u.searchParams.set('app',id);history.replaceState(null,'',u);
 try{localStorage.setItem('membangun-laptop-app',id)}catch{}
}
function onLoad(){
 canBridge=!!currentDocument();
 $('placeholder').hidden=true;
 $('bridgeStatus').textContent=canBridge?'Touchpad + keyboard aktif':'Situs membatasi kontrol tersemat; gunakan ↗ APP';
 if(canBridge){
  try{
   const doc=currentDocument();
   doc.addEventListener('focusin',e=>{if(e.target&&e.target!==doc.body)lastFocus=e.target});
   doc.addEventListener('click',e=>{if(e.target&&e.target.matches('input,textarea,[contenteditable="true"]'))lastFocus=e.target},true);
  }catch{}
 }
}
function configure(){
 try{
  const z=Number(localStorage.getItem('membangun-laptop-zoom'));if(z>=.55&&z<=2.5)zoom=z;
 }catch{}
 for(const app of apps){
  for(const id of ['appTabs','quickApps']){
   const b=document.createElement('button');b.type='button';b.dataset.app=app.id;
   b.textContent=app.label+(id==='appTabs'?'.EXE':'');
   b.addEventListener('click',()=>setApp(app.id));$(id).appendChild(b);
  }
 }
 renderKeyboard();layout();setApp(selected);
}
// Touch gestures: 1 tap = left click, double tap = right click.
// Press and hold then move = drag; 2-finger swipe = scroll in selected editor.
let touching=false,prevTouches=null,moved=false,longHeld=false,startTime=0,scrolling=false,twoFinger=null;
function clearLongPress(){clearTimeout(longPressTimer);longPressTimer=null}
function recordTap(){
 const now=Date.now();
 // A pan can move the cursor far away: detect double taps from timing,
 // not from the last synthetic mouse coordinate.
 if(lastTap&&now-lastTap.time<420){
  clearTimeout(tapTimer);tapTimer=null;lastTap=null;
  setHold(!holdLocked);return;
 }
 clearTimeout(tapTimer);
 const tap={time:now};lastTap=tap;
 tapTimer=setTimeout(()=>{
  tapTimer=null;
  if(lastTap===tap){
   lastTap=null;
   if(!holdLocked)clickMouse(0);
  }
 },320);
}
const pad=$('touchpad');
function pairTouch(touches){
 const a=touches[0],b=touches[1];
 return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2,
         distance:Math.max(1,Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY))};
}
pad.addEventListener('touchstart',e=>{
 e.preventDefault();
 if(e.touches.length>=2){
  clearLongPress();scrolling=true;moved=true;
  // Reinitialize on the second finger; one-finger long-press must not remain held.
  const pair=pairTouch(e.touches);
  twoFinger={start:pair,prev:pair,zoomDistance:pair.distance,kind:'pending'};
  prevTouches={x:pair.x,y:pair.y};
  if(longHeld){releaseMouse();longHeld=false}
  return;
 }
 if(scrolling)return; // A remaining finger after pinch should not trigger a click.
 clearLongPress();touching=true;scrolling=false;moved=false;longHeld=false;startTime=Date.now();
 prevTouches={x:e.touches[0].clientX,y:e.touches[0].clientY};
 longPressTimer=setTimeout(()=>{
  if(touching&&!scrolling&&!moved&&!pressed){pressMouse();longHeld=true}
 },360);
},{passive:false});
pad.addEventListener('touchmove',e=>{
 e.preventDefault();
 if(e.touches.length>=2){
  clearLongPress();
  const pair=pairTouch(e.touches);
  if(!twoFinger)twoFinger={start:pair,prev:pair,zoomDistance:pair.distance,kind:'pending'};
  const g=twoFinger;
  if(g.kind==='pending'){
   const pinchChange=Math.abs(pair.distance-g.start.distance);
   const centerTravel=Math.hypot(pair.x-g.start.x,pair.y-g.start.y);
   // Ratio-based pinch detection avoids confusing a two-finger swipe with zoom.
   if(pinchChange>Math.max(6,g.start.distance*.055)&&pinchChange>centerTravel*.65)g.kind='pinch';
   else if(centerTravel>5&&centerTravel>pinchChange*.8)g.kind='pan';
  }
  if(g.kind==='pinch'){
   // Send discrete mouse-wheel zoom steps to the editor, not the outer page.
   // A threshold avoids runaway zoom at high Android touch sample rates.
   const spacing=14;
   const ticks=Math.max(-4,Math.min(4,Math.trunc((pair.distance-g.zoomDistance)/spacing)));
   if(ticks){
    for(let i=0;i<Math.abs(ticks);i++)zoomInsideApp(Math.sign(ticks));
    g.zoomDistance+=ticks*spacing;
   }
  }else if(g.kind==='pan'){
   const d=gestureDelta(pair.x-g.prev.x,pair.y-g.prev.y);
   panScreen(-d.dy*2.3,-d.dx*2.3);
  }
  g.prev=pair;
  prevTouches={x:pair.x,y:pair.y};moved=true;scrolling=true;return;
 }
 if(!e.touches.length||scrolling)return;
 const t=e.touches[0];
 if(prevTouches){
  const dx=t.clientX-prevTouches.x,dy=t.clientY-prevTouches.y;
  if(Math.abs(dx)+Math.abs(dy)>1.5){moved=true;clearLongPress()}
  const d=gestureDelta(dx,dy);setCursor(cx+d.dx*1.5,cy+d.dy*1.5);movePointer();
 }
 prevTouches={x:t.clientX,y:t.clientY};
},{passive:false});
pad.addEventListener('touchend',e=>{
 e.preventDefault();clearLongPress();
 if(e.touches.length){prevTouches=null;return}
 if(longHeld)releaseMouse();
 else if(!scrolling&&!moved&&Date.now()-startTime<350)recordTap();
 touching=false;prevTouches=null;longHeld=false;scrolling=false;twoFinger=null;
},{passive:false});
pad.addEventListener('touchcancel',()=>{
 clearLongPress();if(longHeld)releaseMouse();
 touching=false;prevTouches=null;longHeld=false;scrolling=false;twoFinger=null;
});
let pointerGesture=null;
pad.addEventListener('pointerdown',e=>{
 if(e.pointerType==='touch')return;
 e.preventDefault();pad.setPointerCapture(e.pointerId);
 pointerGesture={x:e.clientX,y:e.clientY,moved:false};startTime=Date.now();
});
pad.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'||!pointerGesture)return;
 const dx=e.clientX-pointerGesture.x,dy=e.clientY-pointerGesture.y;
 if(Math.abs(dx)+Math.abs(dy)>2)pointerGesture.moved=true;
 pointerGesture.x=e.clientX;pointerGesture.y=e.clientY;
 const d=gestureDelta(dx,dy);setCursor(cx+d.dx*1.3,cy+d.dy*1.3);movePointer();
});
pad.addEventListener('pointerup',e=>{
 if(e.pointerType==='touch'||!pointerGesture)return;
 if(!pointerGesture.moved)recordTap();
 pointerGesture=null;
});
pad.addEventListener('wheel',e=>{e.preventDefault();panScreen(e.deltaY,e.deltaX)},{passive:false});
$('holdClick').addEventListener('click',()=>setHold(!holdLocked));
$('screenUp').addEventListener('click',()=>panScreen(-Math.max(120,scroller.clientHeight*.8)));
$('screenDown').addEventListener('click',()=>panScreen(Math.max(120,scroller.clientHeight*.8)));
scroller.addEventListener('scroll',updateScreenProgress,{passive:true});
$('escapeKey').addEventListener('click',()=>applyKey('ESC'));
$('undoKey').addEventListener('click',()=>{ctrl=true;keyEvent('keydown','Control','ControlLeft');keyEvent('keydown','z','KeyZ');keyEvent('keyup','z','KeyZ');keyEvent('keyup','Control','ControlLeft');ctrl=false;try{currentDocument()?.execCommand('undo')}catch{}});
$('zoomOut').addEventListener('click',()=>setZoom(zoom-.1));
$('zoomIn').addEventListener('click',()=>setZoom(zoom+.1));
$('external').addEventListener('click',()=>window.open(getUrl(selected),'_blank','noopener,noreferrer'));
$('exit').addEventListener('click',()=>location.href='./?app='+encodeURIComponent(selected));
$('fullscreen').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{message('Gunakan Tambah ke layar utama jika fullscreen diblokir')}});
$('pasteKey').addEventListener('click',async()=>{try{const str=await navigator.clipboard.readText();if(str)putText(focusDoc(),str)}catch{message('Izin paste ditolak browser')}});
$('copyKey').addEventListener('click',async()=>{
 const doc=currentDocument();if(!doc)return;
 const node=focusDoc();
 let str='';
 if((node.tagName==='INPUT'||node.tagName==='TEXTAREA')&&node.selectionStart!==null)str=node.value.slice(node.selectionStart,node.selectionEnd);
 else str=doc.getSelection()?.toString()||'';
 if(!str){message('Seleksi teks dulu');return}
 try{await navigator.clipboard.writeText(str);message('Teks tersalin')}catch{message('Izin copy ditolak browser')}
});
function setRotation(on){
 rotated=!!on&&window.innerHeight>window.innerWidth;
 document.body.classList.toggle('rotated',rotated);
 $('rotate90').classList.toggle('active',rotated);
 $('rotate90').title=rotated?'Kembali ke orientasi layar':'Putar tampilan 90 derajat';
 try{localStorage.setItem('membangun-laptop-rotate90',rotated?'1':'0')}catch{}
 requestAnimationFrame(()=>{layout();requestAnimationFrame(layout)});
}
$('rotate90').addEventListener('click',()=>setRotation(!rotated));
try{if(localStorage.getItem('membangun-laptop-rotate90')==='1')setRotation(true)}catch{}
window.addEventListener('resize',()=>{
 if(rotated&&window.innerWidth>window.innerHeight)setRotation(false);
 else layout();
});
if(window.visualViewport)window.visualViewport.addEventListener('resize',layout);
document.addEventListener('keydown',e=>{
 if(e.target===$('nativeInput'))return;
 if(e.key==='Escape'&&document.fullscreenElement){document.exitFullscreen();return}
 if(e.key==='F11'){e.preventDefault();$('fullscreen').click()}
});
configure();
})();
</script>
